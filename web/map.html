<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ロンドン事件地図 — 事件簿アトラス</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
<style>
  #map { height: 68vh; min-height: 420px; border: 1px solid var(--line); border-radius: 8px; }
  .map-legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: .8rem; color: var(--ink-2); margin: 10px 0 16px; }
  .map-legend i { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  .leaflet-popup-content { font-family: inherit; font-size: .85rem; line-height: 1.5; }
  .leaflet-popup-content .en { color: #777; font-style: italic; font-size: .75rem; }
  .approx-note { color: var(--ink-3); font-size: .75rem; margin-top: 8px; }
  nav.views { font-size: .88rem; margin-top: 8px; }
  nav.views a.here { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <header class="site">
    <h1><a href="./">事件簿アトラス</a></h1>
    <div class="sub">ロンドン事件地図 — 正典 60 事件の現場</div>
    <nav class="views"><a href="./">事件簿</a> ｜ <a class="here" href="map.html">地図</a> ｜ <a href="lens.html">レンズ</a></nav>
  </header>

  <section id="filters" aria-label="絞り込み">
    <select id="f-col" aria-label="短編集"></select>
    <select id="f-type" aria-label="事件種別"></select>
    <select id="f-death" aria-label="死者">
      <option value="">死者: すべて</option>
      <option value="yes">死者あり</option>
      <option value="no">死者なし</option>
    </select>
    <label style="display:flex;align-items:center;gap:5px"><input type="checkbox" id="f-london" checked> ロンドン拡大</label>
    <span class="count" id="f-count"></span>
  </section>

  <div class="map-legend" id="legend"></div>
  <div id="map" role="application" aria-label="事件現場の地図"></div>
  <p class="approx-note">○=座標確度の高い現場 / ◍=架空地名などの近傍推定(ポップアップに明示)。★=ベーカー街221B。</p>
</div>
<footer class="app-footer">
  <a href="https://github.com/twill3c/jikenbo-atlas/blob/main/LICENSE">MIT License</a>
  <span>© 2026 坂田哲朗</span>
  <a href="https://github.com/twill3c/jikenbo-atlas">GitHub</a>
  <a id="link-howto" href="https://claude.ai/code/artifact/b86e776b-0192-4883-8d22-09c72c272e27">事件簿アトラスの歩き方</a>
  <a id="link-design" href="https://claude.ai/code/artifact/f86403ca-7333-45a6-839f-3c2a25de6cc7">事件簿アトラス設計図</a>
  <a href="https://app-menu-amber.vercel.app/">App Menu</a>
</footer>
<div id="tip" role="tooltip"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="map.js"></script>
</body>
</html>
